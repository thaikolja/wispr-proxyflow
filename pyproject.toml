[project]
name = "wispr-pro"
version = "1.0.0"
description = "Local MITM helper: shows Wispr Flow as Pro by rewriting the subscription response (educational)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "Kolja" }]

[project.optional-dependencies]
dev = [
    "pytest",
    "mitmproxy>=11",
    "pyinstaller>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
