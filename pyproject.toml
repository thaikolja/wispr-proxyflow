[project]
name = "wispr-pro"
version = "1.0.0"
description = "Local MITM helper: shows Wispr Flow as Pro by rewriting the subscription response (educational)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "Kolja" }]

[project.optional-dependencies]
dev = [
    "pytest",
    "mitmproxy>=11",
    "pyinstaller>=6",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "EXE", "ANN", "COM"]
lint.ignore = [
    "D203",
    "D213",
    "T201",
    "S101",
    "CPY001",
    "TRY003",
    "EM102",
    "FBT001",
    "S603",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

