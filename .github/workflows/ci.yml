name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest ruff mypy
      - run: pytest -q
      - run: ruff check . && ruff format --check .
      - run: mypy wispr_pro.py build_app.py
      - run: python wispr_pro.py selftest

  smoke-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install mitmproxy pytest
      - run: pytest -q
      - run: python wispr_pro.py selftest
